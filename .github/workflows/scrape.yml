name: Scrape jpss.jp

on:
  schedule:
    # 毎月1日 UTC 02:00（JST 11:00）に自動実行
    - cron: '0 2 1 * *'
  # GitHub Actions タブから手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape university schedules
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-jpss.mjs
